# ==============================================================================
# TerraWatch - Mosquitto MQTT Broker Configuration
# Enables dual protocol listeners: standard TCP for ESP32 and WebSockets for Browser
# ==============================================================================

# Standard TCP listener for ESP32 microcontroller
listener 1883
protocol mqtt

# WebSocket listener for TerraWatch Web Dashboard
listener 9001
protocol websockets

# Allow anonymous access for local development & demonstration
allow_anonymous true

# Logging settings
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
